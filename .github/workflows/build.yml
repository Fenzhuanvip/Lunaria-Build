name: Build HAP

on:
  workflow_dispatch:
    inputs:
      ref:
        description: private repo branch to build
        required: false
        default: main

concurrency:
  group: hap-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build HAP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    env:
      CLT_URL: https://image.cdn.dog/commandline-tools-linux-x64-6.1.1.280.zip
      TOOL_HOME: /opt/command-line-tools

    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Fenzhuanvip/Lunaria
          token: ${{ secrets.GH_PAT }}
          path: src
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download HarmonyOS Command Line Tools
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if wget -c -q --tries=2 --timeout=60 "$CLT_URL" -O /tmp/clt.zip; then
              echo "download attempt $i ok"
              break
            fi
            echo "download attempt $i failed, retrying..."
            sleep 5
          done
          ls -lh /tmp/clt.zip
          test $(stat -c%s /tmp/clt.zip) -gt 1000000000
          sudo mkdir -p "$TOOL_HOME"
          sudo unzip -q /tmp/clt.zip -d /opt/
          sudo chown -R "$(id -u):$(id -g)" "$TOOL_HOME"
          sudo chmod -R a+rX "$TOOL_HOME"
          HVIGORW=$(find "$TOOL_HOME" -name hvigorw -type f | head -1)
          test -n "$HVIGORW"
          echo "TOOL_HOME=$TOOL_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$TOOL_HOME/sdk" >> "$GITHUB_ENV"
          echo "$TOOL_HOME/bin" >> "$GITHUB_PATH"
          echo "$(dirname "$HVIGORW")" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          which ohpm || ls "$TOOL_HOME/bin/"
          ohpm -v || true
          ls -la "$TOOL_HOME/sdk/default/openharmony" 2>/dev/null || true

      - name: Fetch QEMU runtime
        run: |
          chmod +x scripts/fetch-qemu.sh
          ./scripts/fetch-qemu.sh

      - name: Install ohpm deps
        run: |
          set -e
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          install_with_retry() {
            local dir="$1"
            for i in 1 2 3 4 5 6; do
              if (cd "$dir" && ohpm install); then
                echo "ohpm install ($dir) ok"
                return 0
              fi
              echo "ohpm install ($dir) attempt $i failed, retry in 15s"
              sleep 15
            done
            return 1
          }
          install_with_retry "."
          install_with_retry "entry"
          install_with_retry "third_party/bettersh/iec/platform/ohos/har"

      - name: Build box64
        run: |
          set -e
          cp third_party/bettersh/scripts/env.sh.example third_party/bettersh/scripts/env.sh
          sed -i 's#^export HAP_LIBS_DIR=.*#export HAP_LIBS_DIR="$ROOT/iec/platform/ohos/har/libs/$NATIVE_ARCH"#' third_party/bettersh/scripts/env.sh
          ./third_party/bettersh/scripts/build_box64.sh
          ls -lh third_party/bettersh/iec/platform/ohos/har/libs/arm64-v8a/libbox64.so

      - name: Build HAP
        run: |
          set -o pipefail
          if node "$TOOL_HOME/hvigor/bin/hvigorw.js" assembleHap \
            --mode module -p product=default -p debuggable=false --no-daemon \
            > build-output.txt 2>&1; then
            echo "BUILD SUCCESSFUL"
          else
            code=$?
            echo "build failed (exit $code), full log is in the private artifact"
            exit $code
          fi

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find . -name "*.hap" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts || true

      - name: Publish to private repo
        if: always()
        uses: ./.github/actions/publish-private
        with:
          token: ${{ secrets.GH_PAT }}
          repository: Fenzhuanvip/Lunaria
          tag: ci-artifacts
          paths: |
            src/artifacts
            src/build-output.txt