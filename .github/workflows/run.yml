name: Run
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'shell command to run'
        required: true
        default: 'gcc --version'
      files_b64:
        description: 'JSON map: path -> base64 content'
        required: false
        default: '{}'
jobs:
  run:
    if: github.actor == 'Fenzhuanvip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
      - name: Write files
        env:
          FILES_B64: ${{ inputs.files_b64 }}
        run: |
          python3 - <<'PY'
          import json, base64, os, sys
          raw = os.environ.get('FILES_B64') or '{}'
          try:
              d = json.loads(raw)
          except Exception as e:
              sys.exit('bad files_b64: %s' % e)
          for p, c in d.items():
              p = os.path.normpath(p)
              if os.path.isabs(p) or p.startswith('..'):
                  sys.exit('bad path: %s' % p)
              d0 = os.path.dirname(p)
              if d0:
                  os.makedirs(d0, exist_ok=True)
              with open(p, 'wb') as f:
                  f.write(base64.b64decode(c))
              print('wrote', p)
          PY
      - name: Run
        env:
          CMD: ${{ inputs.command }}
        run: |
          set -o pipefail
          bash -lc "$CMD" 2>&1 | tee output.txt
          echo "EXIT=${PIPESTATUS[0]}" >> output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-output
          path: output.txt
          if-no-files-found: warn          retention-days: 1
