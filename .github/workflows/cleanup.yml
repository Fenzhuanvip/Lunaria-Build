name: Cleanup

on:
  workflow_run:
    workflows: ["Build HAP"]
    types: [completed]

permissions:
  contents: read

jobs:
  cleanup:
    name: Retention notice
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No-op
        run: echo "CI 运行记录保留由 GitHub Actions 仓库级保留策略（retention days）管理，本工作流不再主动删除记录。"
