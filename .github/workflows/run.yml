name: Run

on:
  workflow_dispatch:
    inputs:
      fixed_command:
        description: '预置命令白名单'
        required: true
        type: choice
        options:
          - 'gcc --version'
          - 'node --version'
          - 'ohpm --version'

permissions:
  contents: read

jobs:
  run:
    if: github.actor == 'Fenzhuanvip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      - name: Run fixed command
        env:
          CMD: ${{ inputs.fixed_command }}
        run: |
          set +e
          bash -lc "$CMD" > output.txt 2>&1
          code=$?
          echo "exit code: $code"
          echo "EXIT=$code" >> output.txt
          exit $code

      - name: Publish to private repo
        if: always()
        uses: ./.github/actions/publish-private
        with:
          token: ${{ secrets.GH_PAT }}
          repository: Fenzhuanvip/Lunaria
          tag: ci-artifacts
          paths: |
            output.txt
            out
