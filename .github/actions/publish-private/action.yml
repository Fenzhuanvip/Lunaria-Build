name: Publish artifacts to private repository
description: Upload build outputs as release assets in a private repository

inputs:
  token:
    description: PAT with repo scope on the target private repository
    required: true
  repository:
    description: Target private repository, owner/name
    required: true
  tag:
    description: Release tag that holds CI artifacts
    required: false
    default: ci-artifacts
  paths:
    description: Newline separated list of files or directories to upload
    required: true

runs:
  using: composite
  steps:
    - name: Upload
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        TARGET_REPO: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        files=()
        while IFS= read -r p; do
          [ -z "$p" ] && continue
          if [ -d "$p" ]; then
            for f in "$p"/*; do
              [ -f "$f" ] && files+=("$f")
            done
          elif [ -f "$p" ]; then
            files+=("$p")
          else
            echo "skip missing: $p"
          fi
        done <<< "$PATHS"
        if [ "${#files[@]}" -eq 0 ]; then
          echo "nothing to publish"
          exit 0
        fi
        gh api "repos/$TARGET_REPO/releases/tags/$TAG" >/dev/null 2>&1 || \
          gh api -X POST "repos/$TARGET_REPO/releases" \
            -f tag_name="$TAG" -f name="CI artifacts" -f body="Automated CI artifacts" >/dev/null
        for f in "${files[@]}"; do
          echo "upload $(basename "$f") ($(stat -c%s "$f") bytes)"
          gh release upload "$TAG" "$f" --repo "$TARGET_REPO" --clobber
        done
        gh api "repos/$TARGET_REPO/releases/tags/$TAG" --jq '.assets[] | .name'