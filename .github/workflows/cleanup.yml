name: Cleanup

on:
  workflow_run:
    workflows: ["Build HAP"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success'
    name: Delete finished build run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete completed build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api -X DELETE "repos/$REPO/actions/runs/$RUN_ID"
      - name: Delete this cleanup run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api -X DELETE "repos/$REPO/actions/runs/$RUN_ID" || true