name: Cleanup

on:
  workflow_run:
    workflows: ["Build HAP"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success'
    name: Delete finished build run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api -X DELETE "repos/$REPO/actions/runs/$RUN_ID"
      - name: Drop older cleanup runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/$REPO/actions/workflows/cleanup.yml/runs?per_page=100" --jq '.workflow_runs[].id')
          for id in $ids; do
            if [ "$id" != "$KEEP" ]; then
              gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
            fi
          done